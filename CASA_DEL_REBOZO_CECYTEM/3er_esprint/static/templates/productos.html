{% extends "base.html" %}
{% block contenido %}
<h2>Registro de productos</h2>
<form method="post" enctype="multipart/form-data">
  <input name="nombre" placeholder="Nombre" required>
  <input name="precio" type="number" step="0.01" min="0" placeholder="Precio" required>
  <input name="cantidad" type="number" min="0" placeholder="Cantidad" required>
  <input name="categoria" placeholder="Categoría" required>
  <textarea name="descripcion" placeholder="Descripción"></textarea>
  <input name="imagen" type="file" accept="image/*">
  <button>Guardar producto</button>
</form>
<table>
  <tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Cantidad</th><th>Categoría</th><th></th></tr>
  {% for p in productos %}
  <tr><td>{{ p.id }}</td><td>{{ p.nombre }}</td><td>${{ p.precio }}</td>
      <td>{{ p.cantidad }}</td><td>{{ p.categoria }}</td>
      <td><a href="{{ url_for('productos.eliminar', id=p.id) }}"
             onclick="return confirm('¿Eliminar?')">Eliminar</a></td></tr>
  {% endfor %}
</table>
{% endblock %}
